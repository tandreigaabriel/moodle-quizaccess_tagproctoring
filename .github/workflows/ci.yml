name: Moodle Plugin CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]
        moodle-branch: ["MOODLE_405_STABLE", "MOODLE_500_STABLE"]
        database: ["mariadb"]
        include:
          - php: "8.3"
            moodle-branch: "MOODLE_405_STABLE"
            database: "pgsql"
          - php: "8.3"
            moodle-branch: "MOODLE_500_STABLE"
            database: "pgsql"

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, pdo, mbstring, curl, xml, zip, intl, gd
          ini-values: max_input_vars=5000

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install moodle-plugin-ci
        run: |
          composer create-project moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> $GITHUB_PATH
          echo "$(pwd)/ci/vendor/bin" >> $GITHUB_PATH

      - name: Install Moodle
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host=127.0.0.1 \
            --branch ${{ matrix.moodle-branch }}
        env:
          DB: ${{ matrix.database }}

      - name: PHP Lint
        run: moodle-plugin-ci phplint ./plugin

      - name: Moodle Code Checker
        run: moodle-plugin-ci phpcs ./plugin --max-warnings 0

      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc ./plugin --max-warnings 0

      - name: Validate Plugin
        run: moodle-plugin-ci validate ./plugin

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints ./plugin

      - name: Grunt AMD
        run: moodle-plugin-ci grunt moodle/mod/quiz/accessrule/tagproctoring --tasks=amd

      - name: Mustache Lint
        run: moodle-plugin-ci mustache moodle/mod/quiz/accessrule/tagproctoring

      - name: Generate PHPUnit locale
        run: sudo locale-gen en_AU.UTF-8

      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning
